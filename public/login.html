<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Theme Admin — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070d;
    --panel: #12121f;
    --panel-2: #1a1a2b;
    --border: #22223a;
    --border-strong: #2f2f4d;
    --text: #f0f0f7;
    --text-2: #a4a4c0;
    --text-3: #74748e;
    --primary: #7c7cff;
    --accent: #c084fc;
    --danger: #ff5b6b;
    --gradient: linear-gradient(135deg, #7c7cff 0%, #c084fc 100%);
    --primary-glow: rgba(124, 124, 255, 0.45);
    --primary-soft: rgba(124, 124, 255, 0.14);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* Animated background orbs */
  body::before, body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 500px; height: 500px;
    background: #7c7cff;
    top: -100px; left: -100px;
    animation: float1 12s ease-in-out infinite;
  }
  body::after {
    width: 500px; height: 500px;
    background: #c084fc;
    bottom: -100px; right: -100px;
    animation: float2 14s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(80px, 60px) scale(1.1); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-60px, -40px) scale(1.1); }
  }

  /* Grid pattern overlay */
  body::before {
    background:
      radial-gradient(circle, #7c7cff 0%, transparent 70%);
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(18, 18, 31, 0.6);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    padding: 40px 32px;
    width: 380px;
    max-width: 100%;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 80px rgba(124, 124, 255, 0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 28px;
  }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--gradient);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px;
    box-shadow: 0 0 32px var(--primary-glow);
  }
  .brand-text {
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.02em;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #fff 0%, #a4a4c0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    color: var(--text-3);
    font-size: 13px;
    margin-bottom: 28px;
  }

  label {
    display: block;
    font-size: 11px;
    color: var(--text-2);
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 16px 0 8px;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    background: var(--panel-2);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  input::placeholder { color: var(--text-3); }
  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft), 0 0 24px rgba(124,124,255,0.12);
  }

  button {
    width: 100%;
    background: var(--gradient);
    color: #fff;
    border: 0;
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: -0.005em;
    cursor: pointer;
    margin-top: 24px;
    box-shadow: 0 0 24px var(--primary-glow);
    transition: all 0.18s ease;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 32px var(--primary-glow), 0 0 32px rgba(192,132,252,0.4);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }

  .msg {
    padding: 12px 14px;
    border-radius: 8px;
    margin-top: 14px;
    font-size: 13px;
    display: none;
  }
  .msg.err {
    background: rgba(255, 91, 107, 0.14);
    color: var(--danger);
    border: 1px solid rgba(255, 91, 107, 0.3);
    display: block;
  }

  *:focus { outline: none; }
  *:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  ::selection { background: var(--primary-soft); color: var(--text); }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">🎨</div>
    <span class="brand-text">Theme Admin</span>
  </div>
  <h1>Chào mừng trở lại</h1>
  <p class="sub">Đăng nhập để tiếp tục quản lý theme</p>
  <label for="email">Email hoặc username</label>
  <input id="email" type="text" name="email" required autofocus autocomplete="username" placeholder="admin@example.com" />
  <label for="password">Mật khẩu</label>
  <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
  <button type="submit" id="btn">Đăng nhập</button>
  <div id="msg" class="msg" role="alert"></div>
</form>
<script>
const f = document.getElementById('f');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  btn.disabled = true;
  btn.textContent = 'Đang đăng nhập…';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: f.email.value.trim().toLowerCase(), password: f.password.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'login failed');
    location.href = '/admin.html';
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
  }
});
</script>
</body>
</html>
